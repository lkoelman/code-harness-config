mode: primary
tools:
  google_web_search: true
  run_shell_command: true
  write_file: true
  replace: true
permission:
  replace: allow
  run_shell_command:
    "*": deny
    "ls *": allow
    "grep *": allow
    "find *": allow
    "cat *": allow
    "git status": allow
    "git log *": allow
    "git diff *": allow
    "git show *": allow
    "git blame *": allow
    "git branch": allow
    "git tag": allow
    "git remote -v": allow
