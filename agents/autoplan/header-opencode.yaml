mode: primary
tools:
  websearch: true
  webfetch: true
  write: false
  edit: false
  bash: true
permission:
  edit: deny
  webfetch: allow
  bash:
    "*": deny
    "ls *": allow
    "grep *": allow
    "find *": allow
    "cat *": allow
    "git status": allow
    "git log *": allow
    "git diff *": allow
    "git show *": allow
    "git blame *": allow
    "git branch": allow
    "git tag": allow
    "git remote -v": allow
